[project]
name = "comtool"
version = "0.1.0"
description = "Extract GPS/G-sensor telemetry from Comtec ZDR055 dashcam footage and render a viewer-style composite"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "certifi>=2024.2.2",
    "numpy>=1.26",
    "pillow>=10.0",
    "scipy>=1.11",
]

[project.scripts]
comtool = "comtool.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/comtool"]
